[advisories]
version = 2
# advisory 扫描统一由 cargo-deny 承担（CI 不再并行跑 cargo-audit），
# 所有豁免集中在本清单，新增豁免必须带"为什么豁免 + 何时回收"的说明。
ignore = [
    # proc-macro-error2 is pulled by SeaORM macros; transitive upstream issue
    # with no safe replacement in the current dependency graph. Revisit on
    # dependency updates.
    "RUSTSEC-2026-0173",
    # rust_decimal keeps rkyv 0.7 as an optional lockfile dependency; the
    # application does not enable that feature. Track until the upstream
    # crate removes the optional edge.
    "RUSTSEC-2026-0235",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
