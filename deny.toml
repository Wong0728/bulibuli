[advisories]
version = 2
# rust_decimal declares rkyv 0.7 only for an optional feature that bulibuli
# does not enable; keep the exception explicit until rust_decimal removes it.
ignore = ["RUSTSEC-2026-0235"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
