<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>补哩补哩远程配对</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/pair.css">
    <script type="module" src="/pair.js"></script>
</head>
<body>

    <!-- 视差背景层。 -->
    <div class="stage" id="stage">
        <!-- 动态生成的碎片将放在这里。 -->
    </div>

    <div class="pairing-card" id="card">
        <div class="header-graphic">
            <svg class="connect-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7" stroke-dasharray="4 2" />
                <circle class="dot-pulse" cx="19" cy="12" r="2" fill="currentColor"/>
                <circle cx="5" cy="12" r="2" fill="currentColor"/>
            </svg>
        </div>

        <h1>补哩补哩远程配对</h1>
        <p class="hint" id="hint">输入配对码以配对</p>

        <form id="pairing-form">
            <div class="input-group">
                <input type="text"
                       id="pairing-input"
                       class="pairing-input"
                       placeholder="XXXX-XXXX"
                       maxlength="9"
                       aria-label="配对码"
                       autocomplete="one-time-code"
                       spellcheck="false">
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
                <div class="loading-spinner"></div>
                <span class="btn-text">确认配对</span>
            </button>
        </form>
    </div>

</body>
</html>
