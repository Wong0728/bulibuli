name: Quality Gates

on:
  workflow_call:
    inputs:
      ref:
        description: "要检查的分支或 Tag"
        required: false
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  frontend-and-policy:
    name: Frontend and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg
      - run: npm ci --ignore-scripts
        working-directory: static/js
      - run: npm run build
        working-directory: static/js
      - run: npx playwright install --with-deps chromium
        working-directory: static/js
      - shell: bash
        run: find static/js -maxdepth 1 -type f -name '*.js' ! -name '*.min.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tests/frontend_live_drawer.mjs
      - run: npm run test:smoke
        working-directory: static/js
      - run: python build.py --check
      - shell: bash
        run: bash -n deploy/linux/install.sh deploy/termux/install.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@bf5592ad9d327ccd561adbb048dedbc4b5e0c2a2 # cargo-audit
      - uses: taiki-e/install-action@cf9eb3f4625079c8224b5fc0cb30d35b8897d2c5 # cargo-deny
      # rust_decimal keeps rkyv 0.7 as an optional lockfile dependency; the
      # application does not enable that feature, so track but do not block on
      # this advisory until the upstream crate removes the optional edge.
      - run: cargo audit --ignore RUSTSEC-2026-0235
      - run: cargo deny check

  windows-build:
    name: Windows build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install media test dependency
        run: choco install ffmpeg -y --no-progress
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: cargo build --locked --release
      - run: python build.py --check
