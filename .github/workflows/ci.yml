name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  frontend-and-policy:
    name: Frontend and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: static/js
      - run: npm run build
        working-directory: static/js
      - run: npx playwright install --with-deps chromium
        working-directory: static/js
      - shell: bash
        run: find static/js -maxdepth 1 -type f -name '*.js' ! -name '*.min.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tests/frontend_live_drawer.mjs
      - run: npm run test:smoke
        working-directory: static/js
      - run: python build.py --check
      - shell: bash
        run: bash -n deploy/linux/install.sh deploy/termux/install.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check

  windows-build:
    name: Windows build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --release
      - run: python build.py --check

  portable-artifacts:
    name: Portable artifact (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-14-arm64
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS runtime tools
        if: matrix.platform == 'macos'
        run: brew install aria2 ffmpeg
      - name: Build frontend bundle
        working-directory: static/js
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build portable archive
        run: python build.py --portable --platform ${{ matrix.platform }} --target ${{ matrix.target }}
      - name: Upload archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: bulibuli-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
