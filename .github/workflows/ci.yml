name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  frontend-and-policy:
    name: Frontend and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg
      - run: npm ci --ignore-scripts
        working-directory: static/js
      - name: Expose frontend test dependencies
        run: ln -s static/js/node_modules node_modules
      - run: npm run build
        working-directory: static/js
      - run: npx playwright install --with-deps chromium
        working-directory: static/js
      - shell: bash
        run: find static/js -maxdepth 1 -type f -name '*.js' ! -name '*.min.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tests/frontend_live_drawer.mjs
      - run: npm run test:smoke
        working-directory: static/js
      - run: python build.py --check
      - shell: bash
        run: bash -n deploy/linux/install.sh deploy/termux/install.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      # rust_decimal keeps rkyv 0.7 as an optional lockfile dependency; the
      # application does not enable that feature, so track but do not block on
      # this advisory until the upstream crate removes the optional edge.
      - run: cargo audit --ignore RUSTSEC-2026-0235
      - run: cargo deny check

  windows-build:
    name: Windows build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install media test dependency
        run: choco install ffmpeg -y --no-progress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --release
      - run: python build.py --check

  portable-artifacts:
    name: Portable artifact (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-14
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS runtime tools
        if: matrix.platform == 'macos'
        run: brew install aria2 ffmpeg
      - name: Install Linux runtime tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y aria2 ffmpeg
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="v$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "${package_version}" = "${GITHUB_REF_NAME}"
      - name: Build frontend bundle
        working-directory: static/js
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build portable archive
        run: python build.py --portable --skip-frontend --platform ${{ matrix.platform }} --target ${{ matrix.target }}
      - name: Build Linux core archive
        if: matrix.platform == 'linux'
        run: python build.py --core --skip-frontend --skip-rust-build --platform linux --target ${{ matrix.target }}
      - name: Upload archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: bulibuli-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bulibuli-*
          path: dist
          merge-multiple: true
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f \( -name '*portable*.zip' -o -name '*portable*.tar.gz' \) | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*portable*.sha256' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*linux*x86_64*core*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*linux*x86_64*core*.sha256' | wc -l)" -eq 1
          for file in dist/bulibuli-*portable-*; do
            case "${file}" in
              *"${GITHUB_REF_NAME}"*) ;;
              *) echo "release file version mismatch: ${file}" >&2; exit 1 ;;
            esac
          done
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="${RUNNER_TEMP}/bulibuli-release-notes.md"
          sed "s|__TAG__|${tag}|g" .github/release-body.md > "${notes_file}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
            gh release edit "${tag}" --title "bulibuli ${tag}" --notes-file "${notes_file}"
          else
            prerelease_flag=()
            [[ "${tag}" == *-alpha* || "${tag}" == *-beta* || "${tag}" == *-rc* ]] && prerelease_flag+=(--prerelease)
            gh release create "${tag}" dist/* --title "bulibuli ${tag}" --notes-file "${notes_file}" "${prerelease_flag[@]}"
          fi
