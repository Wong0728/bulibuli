name: Build minimal FFmpeg

on:
  workflow_call:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg source tag (e.g. n8.1.2)"
        required: false
        type: string
        default: "n8.1.2"
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg source tag (e.g. n8.1.2)"
        required: false
        default: "n8.1.2"

permissions:
  contents: read

concurrency:
  group: build-ffmpeg-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_REF: ${{ inputs.ffmpeg_ref || github.event.inputs.ffmpeg_ref || 'n8.1.2' }}
  X264_REPO: https://code.videolan.org/videolan/x264.git
  # 与 resources/BUILD_INFO.txt 一致：固定 commit 保证"已审计"产物可复现重建
  X264_COMMIT: 0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee
  FREETYPE_VER: 2.13.3
  FRIBIDI_VER: 1.0.16
  HARFBUZZ_VER: 8.5.0
  LIBASS_VER: 0.17.3
  # 上游 tarball 固定 SHA-256（供应链校验，与版本号一一对应）
  FRIBIDI_SHA256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c
  HARFBUZZ_SHA256: 77e4f7f98f3d86bf8788b53e6832fb96279956e1c3961988ea3d4b7ca41ddc27
  LIBASS_SHA256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959
  FFMPEG_N812_SHA256: 9fd092511605bbebafe095ea6d38d9e40f34d12f7386e1258372df8be0576eb7

jobs:
  build-win64:
    name: Cross-compile static win64 FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEPS: /opt/ffdeps
      PKG_CONFIG_PATH: /opt/ffdeps/lib/pkgconfig
      PKG_CONFIG_LIBDIR: /opt/ffdeps/lib/pkgconfig
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            make pkg-config nasm yasm meson ninja-build \
            curl ca-certificates git xz-utils file

      - name: Record tool paths
        run: mkdir -p "$DEPS" src

      # ---------- static dependencies ----------
      - name: Build x264 (static)
        working-directory: src
        run: |
          # fetch 指定 commit（x264 上无稳定 tag 对应本产物），禁止 master 浮动 HEAD
          git init x264
          cd x264
          git remote add origin "$X264_REPO"
          git fetch --depth 1 origin "$X264_COMMIT"
          git checkout --detach FETCH_HEAD
          echo "x264_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          ./configure \
            --prefix="$DEPS" \
            --host=x86_64-w64-mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --enable-static --disable-shared \
            --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Write meson cross file
        working-directory: src
        run: |
          cat > cross-win64.ini <<'EOF'
          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [built-in options]
          default_library = 'static'

          [properties]
          pkg_config_libdir = '/opt/ffdeps/lib/pkgconfig'
          EOF

      - name: Build FreeType (static)
        working-directory: src
        run: |
          git clone --depth 1 --branch "VER-${FREETYPE_VER//./-}" \
            https://github.com/freetype/freetype.git freetype-src
          cd freetype-src
          echo "freetype_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -f meson.build
          meson setup build --cross-file ../cross-win64.ini \
            --prefix="$DEPS" --buildtype=release \
            -Dzlib=disabled -Dbzip2=disabled -Dpng=disabled \
            -Dbrotli=disabled -Dharfbuzz=disabled -Dtests=disabled
          ninja -C build
          ninja -C build install

      - name: Build FriBidi (static)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/fribidi/fribidi/releases/download/v${FRIBIDI_VER}/fribidi-${FRIBIDI_VER}.tar.xz"
          echo "${FRIBIDI_SHA256}  fribidi-${FRIBIDI_VER}.tar.xz" | sha256sum -c -
          tar xf "fribidi-${FRIBIDI_VER}.tar.xz"
          meson setup "fribidi-${FRIBIDI_VER}/build" "fribidi-${FRIBIDI_VER}" --cross-file cross-win64.ini \
            --prefix="$DEPS" --buildtype=release \
            -Ddocs=false -Dtests=false
          ninja -C "fribidi-${FRIBIDI_VER}/build"
          ninja -C "fribidi-${FRIBIDI_VER}/build" install

      - name: Build HarfBuzz (static)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/harfbuzz/harfbuzz/releases/download/${HARFBUZZ_VER}/harfbuzz-${HARFBUZZ_VER}.tar.xz"
          echo "${HARFBUZZ_SHA256}  harfbuzz-${HARFBUZZ_VER}.tar.xz" | sha256sum -c -
          tar xf "harfbuzz-${HARFBUZZ_VER}.tar.xz"
          meson setup "harfbuzz-${HARFBUZZ_VER}/build" "harfbuzz-${HARFBUZZ_VER}" --cross-file cross-win64.ini \
            --prefix="$DEPS" --buildtype=release \
            -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
            -Dicu=disabled -Dtests=disabled -Ddocs=disabled \
            -Dintrospection=disabled -Dbenchmark=disabled -Dutilities=disabled
          ninja -C "harfbuzz-${HARFBUZZ_VER}/build"
          ninja -C "harfbuzz-${HARFBUZZ_VER}/build" install

      - name: Build libass (static, DirectWrite font provider)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/libass/libass/releases/download/${LIBASS_VER}/libass-${LIBASS_VER}.tar.xz"
          echo "${LIBASS_SHA256}  libass-${LIBASS_VER}.tar.xz" | sha256sum -c -
          tar xf "libass-${LIBASS_VER}.tar.xz"
          cd "libass-${LIBASS_VER}"
          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$DEPS" \
            --enable-static --disable-shared \
            --disable-fontconfig --disable-coretext --enable-directwrite
          make -j"$(nproc)"
          make install

      # ---------- FFmpeg ----------
      - name: Download FFmpeg source
        run: |
          curl -fSL -o ffmpeg-src.tar.gz \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_REF}.tar.gz"
          # n8.1.2 之外的 ref（手动触发输入）无法预先 pin 哈希，仅默认版本强制校验
          if [ "${FFMPEG_REF}" = "n8.1.2" ]; then
            echo "${FFMPEG_N812_SHA256}  ffmpeg-src.tar.gz" | sha256sum -c -
          fi
          tar xzf ffmpeg-src.tar.gz
          mv "FFmpeg-${FFMPEG_REF#v}" ffmpeg-src

      # Keep only the capabilities this project actually uses:
      # - live recording: http(s)/tcp/tls(schannel) protocols + flv demuxer/muxer
      #   (reconnect/user_agent options included)
      # - segment merge: concat demuxer + mp4 muxer (movflags/faststart)
      # - audio/video merge & remux: mov/matroska/mp3/aac/ac3/eac3/flac containers,
      #   all stream-copy (-c copy)
      # - danmaku/subtitle burn: ass filter (libass/DirectWrite) + libx264 encoder
      #   + h264/hevc/av1/vp9 decoders
      # TLS uses the Windows-native schannel backend; no third-party crypto lib.
      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: >
          ./configure
          --target-os=mingw32
          --arch=x86_64
          --cross-prefix=x86_64-w64-mingw32-
          --pkg-config=pkg-config
          --enable-static
          --disable-shared
          --disable-everything
          --disable-autodetect
          --disable-doc
          --disable-debug
          --disable-ffplay
          --enable-ffmpeg
          --enable-ffprobe
          --enable-gpl
          --enable-protocol=file,pipe,tcp,tls,http,https
          --enable-demuxer=flv,concat,mov,matroska,mpegts,mp3,aac,ac3,eac3,flac
          --enable-muxer=flv,mp4,ipod,matroska
          --enable-parser=aac,ac3,flac,h264,hevc,mpegaudio,vp9,opus,av1,vorbis
          --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb
          --enable-decoder=h264,hevc,av1,vp9,mjpeg
          --enable-encoder=libx264,mpeg4
          --enable-libx264
          --enable-libass
          --enable-filter=buffer,buffersink,abuffer,abuffersink,ass,scale,format,null
          --enable-schannel
          --extra-cflags="-I/opt/ffdeps/include"
          --extra-ldflags="-static -L/opt/ffdeps/lib"
          --extra-libs="-lstdc++ -ldwrite"

      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: |
          make -j"$(nproc)"
          x86_64-w64-mingw32-strip ffmpeg.exe ffprobe.exe

      # The runner has no wine, so the exes cannot be executed here.
      # Verify artifact shape only; functional checks (protocol listing,
      # http capture, concat merge, burn) are done locally on Windows.
      - name: Sanity check artifacts
        working-directory: ffmpeg-src
        run: |
          file ffmpeg.exe | grep -q "PE32+"
          file ffprobe.exe | grep -q "PE32+"
          test "$(stat -c%s ffmpeg.exe)" -gt 5000000
          test "$(stat -c%s ffprobe.exe)" -gt 5000000
          ls -la ffmpeg.exe ffprobe.exe

      - name: Write build info
        working-directory: ffmpeg-src
        run: |
          {
            echo "ffmpeg: ${FFMPEG_REF} (https://github.com/FFmpeg/FFmpeg/tree/${FFMPEG_REF})"
            echo "x264: master @ ${x264_commit} (${X264_REPO})"
            echo "freetype: VER-${FREETYPE_VER} @ ${freetype_commit} (github.com/freetype/freetype)"
            echo "fribidi: ${FRIBIDI_VER}"
            echo "harfbuzz: ${HARFBUZZ_VER}"
            echo "libass: ${LIBASS_VER} (DirectWrite font provider)"
            echo "license: GPL-2.0+ overall (libx264); deps ISC/BSD/MIT/Zlib/Freetype"
            echo "build: GitHub Actions ubuntu-latest, x86_64-w64-mingw32 cross, fully static"
            echo "tls: Windows schannel"
            echo
            echo "configure:"
            grep -E "^#define FFMPEG_CONFIGURATION" config.h || true
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-minimal-win64-${{ env.FFMPEG_REF }}
          path: |
            ffmpeg-src/ffmpeg.exe
            ffmpeg-src/ffprobe.exe
            ffmpeg-src/BUILD_INFO.txt
          if-no-files-found: error

  # Linux 精简 FFmpeg：在 ubuntu 22.04 容器内原生构建（glibc 2.35 基线，
  # 与 Release 包的最低兼容目标一致）。媒体依赖（x264/libass 等）静态链接，
  # TLS 用 GnuTLS、字体用 Fontconfig 走系统动态库——相比发行版 ffmpeg 可把
  # portable 包 resources/lib/ 从 ~240MB 降到几十 MB。
  build-linux-x86_64:
    name: Build minimal linux x86_64 FFmpeg (glibc 2.35)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    # 容器默认 shell 是 sh（dash），步骤里用了 bash 特有的 ${VAR//./-} 替换。
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    env:
      DEPS: /opt/ffdeps
      # meson 在 Ubuntu 多架构系统上把 .pc 装到 lib/<triplet>/pkgconfig，
      # 两条路径都要给 pkg-config。
      PKG_CONFIG_PATH: /opt/ffdeps/lib/pkgconfig:/opt/ffdeps/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc g++ make pkg-config nasm yasm meson ninja-build \
            curl ca-certificates git xz-utils file \
            libfontconfig1-dev libfreetype-dev libgnutls28-dev libexpat1-dev

      - name: Record tool paths
        run: mkdir -p "$DEPS" src

      - name: Build x264 (static)
        working-directory: src
        run: |
          git init x264
          cd x264
          git remote add origin "$X264_REPO"
          git fetch --depth 1 origin "$X264_COMMIT"
          git checkout --detach FETCH_HEAD
          echo "x264_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          ./configure \
            --prefix="$DEPS" \
            --enable-static --disable-shared \
            --disable-cli --disable-opencl
          make -j"$(nproc)"
          make install

      - name: Build FreeType (static)
        working-directory: src
        run: |
          git clone --depth 1 --branch "VER-${FREETYPE_VER//./-}" \
            https://github.com/freetype/freetype.git freetype-src
          cd freetype-src
          echo "freetype_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          meson setup build --prefix="$DEPS" --buildtype=release \
            -Ddefault_library=static \
            -Dzlib=disabled -Dbzip2=disabled -Dpng=disabled \
            -Dbrotli=disabled -Dharfbuzz=disabled -Dtests=disabled
          ninja -C build
          ninja -C build install

      - name: Build FriBidi (static)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/fribidi/fribidi/releases/download/v${FRIBIDI_VER}/fribidi-${FRIBIDI_VER}.tar.xz"
          echo "${FRIBIDI_SHA256}  fribidi-${FRIBIDI_VER}.tar.xz" | sha256sum -c -
          tar xf "fribidi-${FRIBIDI_VER}.tar.xz"
          meson setup "fribidi-${FRIBIDI_VER}/build" "fribidi-${FRIBIDI_VER}" \
            --prefix="$DEPS" --buildtype=release -Ddefault_library=static \
            -Ddocs=false -Dtests=false
          ninja -C "fribidi-${FRIBIDI_VER}/build"
          ninja -C "fribidi-${FRIBIDI_VER}/build" install

      - name: Build HarfBuzz (static)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/harfbuzz/harfbuzz/releases/download/${HARFBUZZ_VER}/harfbuzz-${HARFBUZZ_VER}.tar.xz"
          echo "${HARFBUZZ_SHA256}  harfbuzz-${HARFBUZZ_VER}.tar.xz" | sha256sum -c -
          tar xf "harfbuzz-${HARFBUZZ_VER}.tar.xz"
          meson setup "harfbuzz-${HARFBUZZ_VER}/build" "harfbuzz-${HARFBUZZ_VER}" \
            --prefix="$DEPS" --buildtype=release -Ddefault_library=static \
            -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
            -Dicu=disabled -Dtests=disabled -Ddocs=disabled \
            -Dintrospection=disabled -Dbenchmark=disabled -Dutilities=disabled
          ninja -C "harfbuzz-${HARFBUZZ_VER}/build"
          ninja -C "harfbuzz-${HARFBUZZ_VER}/build" install

      - name: Build libass (static, fontconfig provider)
        working-directory: src
        run: |
          curl -fsSLO "https://github.com/libass/libass/releases/download/${LIBASS_VER}/libass-${LIBASS_VER}.tar.xz"
          echo "${LIBASS_SHA256}  libass-${LIBASS_VER}.tar.xz" | sha256sum -c -
          tar xf "libass-${LIBASS_VER}.tar.xz"
          cd "libass-${LIBASS_VER}"
          ./configure \
            --prefix="$DEPS" \
            --enable-static --disable-shared
          # fontconfig 走系统动态库（apt），freetype/fribidi/harfbuzz 走静态自建
          make -j"$(nproc)"
          make install

      - name: Download FFmpeg source
        run: |
          curl -fSL -o ffmpeg-src.tar.gz \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_REF}.tar.gz"
          if [ "${FFMPEG_REF}" = "n8.1.2" ]; then
            echo "${FFMPEG_N812_SHA256}  ffmpeg-src.tar.gz" | sha256sum -c -
          fi
          tar xzf ffmpeg-src.tar.gz
          mv "FFmpeg-${FFMPEG_REF#v}" ffmpeg-src

      # 能力集合与 win64 版一致：flv 直播录制、concat/mp4 合并、流复制封装、
      # ass 弹幕压制（libass/fontconfig + libx264）+ h264/hevc/av1/vp9 解码。
      # TLS 使用 GnuTLS；--disable-autodetect 防止系统库被意外引入。
      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: >
          ./configure
          --pkg-config=pkg-config
          --enable-static
          --disable-shared
          --disable-everything
          --disable-autodetect
          --disable-doc
          --disable-debug
          --disable-ffplay
          --enable-ffmpeg
          --enable-ffprobe
          --enable-gpl
          --enable-protocol=file,pipe,tcp,tls,http,https
          --enable-demuxer=flv,concat,mov,matroska,mpegts,mp3,aac,ac3,eac3,flac
          --enable-muxer=flv,mp4,ipod,matroska
          --enable-parser=aac,ac3,flac,h264,hevc,mpegaudio,vp9,opus,av1,vorbis
          --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb
          --enable-decoder=h264,hevc,av1,vp9,mjpeg
          --enable-encoder=libx264,mpeg4
          --enable-libx264
          --enable-libass
          --enable-fontconfig
          --enable-gnutls
          --enable-filter=buffer,buffersink,abuffer,abuffersink,ass,scale,format,null
          --extra-cflags="-I/opt/ffdeps/include"
          --extra-ldflags="-L/opt/ffdeps/lib"
          --extra-libs="-lstdc++"

      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: |
          make -j"$(nproc)"
          strip ffmpeg ffprobe

      - name: Sanity check artifacts
        working-directory: ffmpeg-src
        run: |
          ./ffmpeg -version | head -n 1
          ./ffprobe -version | head -n 1
          ./ffmpeg -hide_banner -protocols 2>/dev/null | grep -E '\b(https|tcp|file)\b'
          test "$(stat -c%s ffmpeg)" -gt 5000000
          test "$(stat -c%s ffprobe)" -gt 500000
          echo "--- 动态依赖（应只有 GnuTLS/Fontconfig/libc 等少量条目）---"
          ldd ffmpeg | tee /tmp/ldd.txt
          test "$(wc -l < /tmp/ldd.txt)" -lt 30

      - name: Write build info
        working-directory: ffmpeg-src
        run: |
          {
            echo "ffmpeg: ${FFMPEG_REF} (https://github.com/FFmpeg/FFmpeg/tree/${FFMPEG_REF})"
            echo "x264: master @ ${x264_commit} (${X264_REPO})"
            echo "freetype: VER-${FREETYPE_VER//./-} @ ${freetype_commit} (github.com/freetype/freetype)"
            echo "fribidi: ${FRIBIDI_VER}"
            echo "harfbuzz: ${HARFBUZZ_VER}"
            echo "libass: ${LIBASS_VER} (fontconfig provider)"
            echo "license: GPL-2.0+ overall (libx264); deps ISC/BSD/MIT/Zlib/Freetype"
            echo "build: GitHub Actions ubuntu:22.04 container native (glibc 2.35 baseline), deps static, GnuTLS/Fontconfig dynamic"
            echo "tls: GnuTLS (system)"
            echo
            echo "configure:"
            grep -E "^#define FFMPEG_CONFIGURATION" config.h || true
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-minimal-linux-x86_64-${{ env.FFMPEG_REF }}
          path: |
            ffmpeg-src/ffmpeg
            ffmpeg-src/ffprobe
            ffmpeg-src/BUILD_INFO.txt
          if-no-files-found: error
