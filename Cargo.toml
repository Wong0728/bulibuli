[package]
name = "bulibuli"
version = "2.0.0"
edition = "2021"
authors = ["Wong0728"]
description = "补哩补哩（bulibuli）——下架之前，先下为敬。"
license = "MIT"
repository = "https://github.com/Wong0728/bulibuli"
keywords = ["bilibili", "downloader", "live-recording", "rust"]
categories = ["multimedia", "web-programming::http-server"]
publish = false
rust-version = "1.97.1"

[[bin]]
name = "bulibuli"
path = "src/main.rs"

[[bin]]
name = "bulibuli-launcher"
path = "src/launcher.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }

# Web 框架
axum = { version = "0.8" }
tower-http = { version = "0.7", features = ["fs"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

# HTTP 客户端（使用 rustls，避免依赖系统 OpenSSL）
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "stream", "query", "rustls-no-provider", "webpki-roots", "gzip", "deflate", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

# 数据库（使用 rustls，避免依赖系统 OpenSSL）
sea-orm = { version = "2.0", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
# 直接引用 sqlx：连接池 PRAGMA 必须通过 SqliteConnectOptions 才能对每个池化连接生效
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

# WebSocket / Socket.IO
socketioxide = { version = "0.18", features = ["state"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# 压缩（弹幕 WebSocket 协议解压）
brotli = "8"
flate2 = "1"

# 日志 / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 配置通过标准库环境变量 API 读取。
arc-swap = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# 加密 / 哈希
md5 = "0.7"
murmur3 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
subtle = "2"

# 工具
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
ipnet = { version = "2", features = ["serde"] }
toml = "0.8"
maxminddb = "0.30"
futures = "0.3"
regex = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
fs2 = "0.4"
tempfile = "3"
socket2 = "0.6"

# 速率限制
governor = "0.10"

# 进程管理 / 路径查找
which = "7"

# 自动打开浏览器（Setup 向导）
open = "5"

# 终端交互界面（日志分区 + 命令说明 + 命令输入）
ratatui = "0.30"

# Protobuf（弹幕 seg.so 解析）
prost = "0.13"

# Windows 专用：用 Job Object 确保父进程退出（含被强杀）时子进程 aria2c 一起被系统结束，避免残留占用下载目录
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
# 弹幕协议边界测试：随机包头、压缩正文和嵌套包均必须返回错误或结果，不能 panic。
proptest = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# 保持 unwind：download/live_recorder 等后台任务依赖 catch_unwind 兜底回滚状态，
# abort 会让任一 worker panic 直接带走整个进程（经 Job Object 连带杀 aria2c）。
panic = "unwind"
